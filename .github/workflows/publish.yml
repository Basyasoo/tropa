name: Publish release

# Copies a new build from the Tropa update server into GitHub Releases.
# No tokens are stored anywhere: the job uses the repository's own short-lived token.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  SOURCE: https://shpion-177-202-66-200.sslip.io/app

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Keep the schedule alive
        run: gh api -X PUT "repos/$GH_REPO/actions/workflows/publish.yml/enable"

      - name: Publish a new version
        run: |
          curl -fsSL --retry 3 "$SOURCE/version.json" -o version.json
          version=$(jq -er .version version.json)
          sha=$(jq -er .android.sha256 version.json)
          notes=$(jq -er .notes version.json)
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          if ! gh release view "v$version" >/dev/null 2>&1; then
            curl -fsSL --retry 3 "$SOURCE/Tropa.apk" -o Tropa.apk
            echo "$sha  Tropa.apk" | sha256sum -c -
            sha256sum Tropa.apk > Tropa.apk.sha256
            gh release create "v$version" Tropa.apk Tropa.apk.sha256 version.json --title "Тропа $version" --notes "$notes"
          fi
          win=$(curl -fsSL "$SOURCE/Tropa-Setup.sha256" || true)
          have=$(gh release download "v$version" -p Tropa-Setup.exe.sha256 -O - 2>/dev/null | cut -d' ' -f1 || true)
          if [ -n "$win" ] && [ "$win" != "$have" ]; then
            curl -fsSL --retry 3 "$SOURCE/Tropa-Setup.exe" -o Tropa-Setup.exe
            echo "$win  Tropa-Setup.exe" | sha256sum -c -
            sha256sum Tropa-Setup.exe > Tropa-Setup.exe.sha256
            gh release upload "v$version" Tropa-Setup.exe Tropa-Setup.exe.sha256 --clobber
            gh release delete-asset "v$version" Tropa-Windows.zip -y || true
            gh release delete-asset "v$version" Tropa-Windows.zip.sha256 -y || true
          fi
